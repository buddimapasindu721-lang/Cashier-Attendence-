
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASINDU Cashier Attendance</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px;color:white;font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#09051d,#25104b,#062b32,#180b32);
 background-size:300% 300%;
 animation:bgmove 12s ease infinite;
 min-height:100vh;
}
@keyframes bgmove{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}
.app{max-width:560px;margin:auto}
.card{
 padding:17px;margin-bottom:14px;border-radius:21px;
 background:linear-gradient(145deg,#ffffff16,#ffffff08);
 border:1px solid #ffffff30;
 box-shadow:0 10px 30px #0005;
 backdrop-filter:blur(15px);
}
.hero{
 text-align:center;
 background:linear-gradient(120deg,#8b21c9,#4232b4,#087f83,#12834b);
 background-size:250% 250%;
 animation:bgmove 8s infinite;
 padding:24px 10px;
}
.brand{font-size:23px;font-weight:900;letter-spacing:1px}
.brand span{color:#b6ff77}
.clock{
 font-size:39px;font-weight:900;margin-top:17px;
 text-shadow:0 0 18px #fff8;
}
.liveDate{margin-top:7px;font-size:14px}
.user{
 display:inline-block;margin-top:15px;padding:9px 18px;
 border-radius:30px;background:#ffffff27;
 border:1px solid #ffffff55;font-weight:bold
}
.heading{font-size:17px;font-weight:900;color:#e6b8ff;margin-bottom:14px}
label{display:block;color:#d8c8f3;font-size:13px;margin:12px 0 7px}
input{
 width:100%;padding:13px;border-radius:12px;
 background:#110d27;color:white;border:1px solid #9b69d1;
 font-size:16px;outline:none;
}
input:focus{border-color:#63ffd0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{
 border:0;border-radius:14px;padding:15px 5px;
 background:#30234d;color:white;font-weight:900;font-size:15px;
}
.tab.active{
 background:linear-gradient(120deg,#a855f7,#ec4899);
 box-shadow:0 0 18px #d946ef77;
}
.shiftGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shift{
 border-radius:15px;background:#272040;color:white;
 border:1px solid #79608e;padding:13px 3px;
 min-height:88px;font-weight:bold;
}
.shift .emoji{display:block;font-size:25px;margin-bottom:7px}
.shift small{display:block;font-size:11px;margin-top:6px;color:#ddd}
.shift.active{
 background:linear-gradient(145deg,#087b52,#19a65a);
 border:2px solid #9dffbf;
 box-shadow:0 0 17px #22c55e88;
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.action{
 border:0;border-radius:13px;padding:14px 5px;
 color:white;font-weight:900;
}
.save{background:linear-gradient(110deg,#7c3aed,#ec4899,#db2777)}
.off{background:linear-gradient(110deg,#596276,#343d52)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{
 border-radius:16px;padding:15px 9px;text-align:center;
}
.sum.purple{background:linear-gradient(135deg,#8529cf,#4b1c8d)}
.sum.green{background:linear-gradient(135deg,#0a9a69,#075344)}
.sum small{font-size:11px;font-weight:bold}
.sum strong{display:block;font-size:20px;margin-top:9px;color:#c2ffce}
.day{
 background:#1d1832;border:1px solid #ffffff20;
 padding:13px;border-radius:14px;margin-bottom:9px;
}
.daytop{display:flex;justify-content:space-between;gap:5px;align-items:center}
.dayname{font-weight:900}
.salary{font-weight:900;color:#7effb1;text-align:right}
.detail{font-size:12px;color:#c7b9dc;margin-top:8px;line-height:1.6}
.status{
 display:inline-block;padding:5px 9px;border-radius:20px;
 font-size:10px;margin-top:7px;font-weight:bold
}
.worked{background:#087b4d;color:#b5ffcf}
.rest{background:#596078;color:white}
.selectedDay{border:2px solid #e879f9}
.editBtn{
 border:0;border-radius:8px;padding:7px 11px;
 background:#6037a0;color:white;margin-top:9px;font-size:11px
}
.total{
 background:linear-gradient(110deg,#6922a5,#086b55);
 border-radius:15px;padding:17px;text-align:center;margin-top:12px
}
.total small{color:#eee}
.total strong{display:block;font-size:25px;color:#b9ffcb;margin-top:7px}
.empty{text-align:center;color:#b8a9d1;padding:15px}
.message{text-align:center;font-size:13px;margin-top:10px;min-height:18px}
.footer{text-align:center;color:#b9a8d2;font-size:11px;padding:14px}
.login{
 display:none;position:fixed;inset:0;background:#0a061a;
 z-index:10;align-items:center;justify-content:center;padding:20px
}
.loginbox{
 width:100%;max-width:400px;padding:25px;border-radius:24px;
 background:linear-gradient(140deg,#7b24b5,#252064,#076b53);
 border:1px solid #ffffff55;
 box-shadow:0 0 40px #a855f755
}
.loginbox h2{text-align:center}
.loginbox p{text-align:center;color:#eee}
.primary{
 width:100%;border:0;border-radius:13px;padding:15px;
 background:linear-gradient(100deg,#ec4899,#7c3aed,#0891b2);
 color:white;font-weight:900;margin-top:15px
}
@media(max-width:360px){
 .clock{font-size:30px}
 .card{padding:13px}
 .shift{font-size:12px}
}
</style>
</head>

<body>
<div class="app">

<div class="card hero">
 <div class="brand">✦ PASINDU <span>CASHIER</span></div>
 <div style="font-size:11px;letter-spacing:3px;margin-top:6px">SHIFT MANAGEMENT</div>
 <div class="clock" id="clock">00:00:00</div>
 <div class="liveDate" id="liveDate">Loading...</div>
 <div class="user" id="userDisplay">👤 Cashier</div>
</div>

<div class="card">
 <div class="heading">🌈 MONTH & YEAR</div>
 <input type="month" id="month">
</div>

<div class="card">
 <div class="heading">💎 SELECT PERIOD</div>
 <div class="tabs">
  <button class="tab active" id="tab1">💜 1 – 15</button>
  <button class="tab" id="tab2">💚 16 – END</button>
 </div>
</div>

<div class="card">
 <div class="heading">⚡ MARK YOUR SHIFTS</div>
 <label>Working Date</label>
 <input type="date" id="workDate">

 <label>Select Multiple Shifts</label>
 <div class="shiftGrid">
  <button class="shift" data-shift="Day">
   <span class="emoji">☀️</span>DAY
   <small>Rs. 1,550</small>
  </button>
  <button class="shift" data-shift="Evening">
   <span class="emoji">🌇</span>EVENING
   <small>Rs. 1,650</small>
  </button>
  <button class="shift" data-shift="Night">
   <span class="emoji">🌙</span>NIGHT
   <small>Rs. 2,250</small>
  </button>
 </div>

 <div class="actions">
  <button class="action save" id="saveBtn">💾 SAVE SHIFT</button>
  <button class="action off" id="offBtn">⚪ MARK OFF</button>
 </div>
 <div class="message" id="message"></div>
</div>

<div class="card">
 <div class="heading">💰 SALARY TOTALS</div>
 <div class="summary">
  <div class="sum purple">
   <small>💜 1 – 15 TOTAL</small>
   <strong id="total1">Rs. 0</strong>
  </div>
  <div class="sum green">
   <small>💚 16 – END TOTAL</small>
   <strong id="total2">Rs. 0</strong>
  </div>
 </div>
</div>

<div class="card">
 <div class="heading" id="listTitle">📅 DAYS 1 – 15</div>
 <div id="daysList"></div>
 <div class="total">
  <small>SELECTED PERIOD TOTAL</small>
  <strong id="periodTotal">Rs. 0</strong>
 </div>
</div>

<div class="footer">✦ PASINDU CASHIER ATTENDANCE ✦</div>
</div>

<div class="login" id="login">
 <div class="loginbox">
  <h2>🌈 WELCOME</h2>
  <p>Enter your name to continue</p>
  <label>Your Name</label>
  <input id="nameInput" maxlength="60" placeholder="Enter your name">
  <button class="primary" id="loginBtn">CONTINUE ➜</button>
 </div>
</div>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,signInAnonymously,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,collection,doc,getDocs,setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* REPLACE WITH YOUR FIREBASE CONFIG */
const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID",
 storageBucket:"YOUR_PROJECT.appspot.com",
 messagingSenderId:"YOUR_SENDER_ID",
 appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const RATES={Day:1550,Evening:1650,Night:2250};
const $=id=>document.getElementById(id);

let uid=null;
let username="";
let records={};
let selected=[];
let activeTab=1;
let month="";

function lkDate(){
 return new Intl.DateTimeFormat("en-CA",{
  timeZone:"Asia/Colombo",
  year:"numeric",month:"2-digit",day:"2-digit"
 }).format(new Date());
}

function updateClock(){
 const now=new Date();
 $("clock").textContent=new Intl.DateTimeFormat("en-US",{
  timeZone:"Asia/Colombo",hour:"2-digit",
  minute:"2-digit",second:"2-digit",hour12:true
 }).format(now);

 $("liveDate").textContent=new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Colombo",weekday:"long",day:"2-digit",
  month:"long",year:"numeric"
 }).format(now);
}
updateClock();
setInterval(updateClock,1000);

function showLogin(){
 $("login").style.display="flex";
}

function setUser(name){
 username=name.trim();
 localStorage.setItem("cashier_username",username);
 $("userDisplay").textContent="👤 "+username;
 $("login").style.display="none";
}

$("loginBtn").onclick=()=>{
 const name=$("nameInput").value.trim();
 if(!name)return alert("Enter your name");
 if(!uid)return alert("Please wait for connection");
 setUser(name);
 loadMonth();
};

function loginCheck(){
 const saved=localStorage.getItem("cashier_username");
 if(saved){
  username=saved;
  $("userDisplay").textContent="👤 "+username;
 }else{
  showLogin();
 }
}

function attendanceRef(){
 return collection(db,"users",uid,"attendance");
}

async function loadMonth(){
 if(!uid||!username||!month)return;

 $("message").textContent="Loading...";
 try{
  const snapshot=await getDocs(attendanceRef());
  records={};

  snapshot.forEach(s=>{
   const data=s.data();
   if(data.date && data.date.startsWith(month)){
    records[data.date]=data;
   }
  });

  $("message").textContent="";
  const date=$("workDate").value;
  selected=records[date]?[...records[date].shifts]:[];
  updateButtons();
  render();
 }catch(error){
  $("message").textContent="Database error: "+error.message;
 }
}

async function saveDay(isOff=false){
 if(!uid||!username)return;

 const date=$("workDate").value;
 if(!date)return alert("Select date");
 if(date.slice(0,7)!==month)return alert("Select correct month");
 if(!isOff&&!selected.length)return alert("Select a shift");

 const shifts=isOff?[]:[...selected];
 const salary=shifts.reduce((sum,s)=>sum+(RATES[s]||0),0);

 $("saveBtn").disabled=true;
 $("offBtn").disabled=true;
 $("message").textContent="Saving...";

 try{
  await setDoc(doc(db,"users",uid,"attendance",date),{
   date:date,
   name:username,
   shifts:shifts,
   salary:salary,
   updatedAt:new Date().toISOString()
  });

  $("message").textContent="✅ Saved successfully!";
  await loadMonth();
 }catch(error){
  $("message").textContent="❌ "+error.message;
 }finally{
  $("saveBtn").disabled=false;
  $("offBtn").disabled=false;
 }
}

$("saveBtn").onclick=()=>saveDay(false);
$("offBtn").onclick=()=>saveDay(true);

function updateButtons(){
 document.querySelectorAll(".shift").forEach(b=>{
  b.classList.toggle("active",selected.includes(b.dataset.shift));
 });
}

document.querySelectorAll(".shift").forEach(b=>{
 b.onclick=()=>{
  const s=b.dataset.shift;
  selected=selected.includes(s)?
   selected.filter(x=>x!==s):[...selected,s];
  updateButtons();
 };
});

function changeTab(n){
 activeTab=n;
 $("tab1").classList.toggle("active",n===1);
 $("tab2").classList.toggle("active",n===2);
 $("listTitle").textContent=n===1?"📅 DAYS 1 – 15":"📅 DAYS 16 – END";
 selected=[];
 updateButtons();
 render();
}
$("tab1").onclick=()=>changeTab(1);
$("tab2").onclick=()=>changeTab(2);

function money(n){
 return "Rs. "+Number(n||0).toLocaleString("en-US");
}

function render(){
 if(!month)return;

 const y=Number(month.slice(0,4));
 const m=Number(month.slice(5,7));
 const days=new Date(y,m,0).getDate();
 let total1=0,total2=0,period=0,html="";

 for(let d=1;d<=days;d++){
  const date=month+"-"+String(d).padStart(2,"0");
  const item=records[date];
  const shifts=item?.shifts||[];
  const salary=shifts.reduce((s,x)=>s+(RATES[x]||0),0);

  if(d<=15)total1+=salary;
  else total2+=salary;

  if((activeTab===1&&d<=15)||(activeTab===2&&d>=16)){
   period+=salary;
   const dayName=new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short"});
   const isSelected=$("workDate").value===date;
   const detail=shifts.length?
    shifts.map(s=>s+" ("+money(RATES[s])+")").join(" + "):
    "OFF / No shift marked";

   html+=`
   <div class="day ${isSelected?"selectedDay":""}">
    <div class="daytop">
     <div>
      <div class="dayname">${d} • ${dayName}</div>
      <span class="status ${shifts.length?"worked":"rest"}">
       ${shifts.length?"✓ WORKED":"⚪ OFF"}
      </span>
     </div>
     <div class="salary">${money(salary)}</div>
    </div>
    <div class="detail">${detail}</div>
    <button class="editBtn" data-date="${date}">✏️ SELECT DAY</button>
   </div>`;
  }
 }

 $("daysList").innerHTML=html;
 $("total1").textContent=money(total1);
 $("total2").textContent=money(total2);
 $("periodTotal").textContent=money(period);

 document.querySelectorAll(".editBtn").forEach(b=>{
  b.onclick=()=>{
   $("workDate").value=b.dataset.date;
   selected=records[b.dataset.date]?
    [...records[b.dataset.date].shifts]:[];
   updateButtons();
   render();
   window.scrollTo({top:0,behavior:"smooth"});
  };
 });
}

$("month").onchange=()=>{
 month=$("month").value;
 if(!month)return;
 const today=lkDate();
 $("workDate").value=today.startsWith(month)?today:month+"-01";
 selected=[];
 changeTab(1);
 loadMonth();
};

$("workDate").onchange=()=>{
 const date=$("workDate").value;
 if(!date)return;
 if(date.slice(0,7)!==month){
  month=date.slice(0,7);
  $("month").value=month;
  changeTab(Number(date.slice(8,10))<=15?1:2);
  loadMonth();
 }else{
  selected=records[date]?[...records[date].shifts]:[];
  updateButtons();
  render();
 }
};

async function start(){
 try{
  await signInAnonymously(auth);
 }catch(error){
  $("message").textContent="Connection error: "+error.message;
 }
}

onAuthStateChanged(auth,user=>{
 if(!user)return;
 uid=user.uid;
 loginCheck();
 if(username)loadMonth();
});

const today=lkDate();
$("month").value=today.slice(0,7);
$("workDate").value=today;
month=today.slice(0,7);

start();
</script>
</body>
</html>
