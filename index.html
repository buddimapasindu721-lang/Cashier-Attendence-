
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PASINDU Cashier Attendance</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;color:white;
 background:linear-gradient(135deg,#16002e,#102b65,#071b35);
 min-height:100vh;padding:14px
}
header{
 text-align:center;padding:18px 10px;
 background:linear-gradient(120deg,#ff0080,#7928ca,#00c6ff);
 border-radius:20px;box-shadow:0 5px 25px #0006
}
h1{margin:0;font-size:23px}
.clock{font-size:20px;font-weight:bold;margin-top:9px}
.card{
 background:#ffffff13;border:1px solid #ffffff35;
 border-radius:18px;padding:15px;margin-top:15px;
 box-shadow:0 5px 18px #0003
}
input,select{
 padding:12px;border:0;border-radius:10px;
 width:100%;font-size:16px;margin:6px 0;
 background:#fff;color:#222
}
button{
 border:0;border-radius:10px;padding:11px 14px;
 font-weight:bold;cursor:pointer;margin:3px
}
.primary{background:#00e5ff;color:#001b35}
.daybtn{background:#27e66b;color:#003c18}
.evebtn{background:#ff9c27;color:#381800}
.nightbtn{background:#8b5cf6;color:white}
.clearbtn{background:#ff4567;color:white}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;background:#ffffff25;color:white}
.tabs button.active{background:#00d9ff;color:#001b35}
.dateRow{
 background:#ffffff16;border:1px solid #ffffff2b;
 border-radius:14px;padding:12px;margin:10px 0
}
.dateTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dateName{font-size:18px;font-weight:bold}
.salary{color:#75ffbd;font-weight:bold;white-space:nowrap}
.shiftButtons{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.shiftButtons button{flex:1;min-width:85px}
.shiftButtons button.selected{outline:3px solid white;filter:brightness(1.2)}
.off{font-size:12px;color:#bbb;margin-top:8px}
.total{
 text-align:center;font-size:22px;font-weight:bold;
 color:#ffe66d;padding:12px
}
.poya{
 display:flex;align-items:center;gap:12px;
 color:#ffd76a;font-weight:bold
}
.poyaLetters{
 font-size:14px;line-height:14px;text-align:center;
 color:#ffe58a;text-shadow:0 0 9px #ffae00;
 animation:glow 1.5s infinite alternate
}
@keyframes glow{from{opacity:.65}to{opacity:1;text-shadow:0 0 18px gold}}
.small{font-size:12px;color:#ddd}
</style>
</head>
<body>

<header>
<h1>🏇 PASINDU CASHIER SYSTEM</h1>
<div class="clock" id="clock"></div>
<div id="today"></div>
</header>

<div class="card">
<label>Cashier Name</label>
<input id="cashier" placeholder="Enter your name">
<button class="primary" onclick="saveName()">SAVE NAME</button>
<div class="small">Your name is saved on this phone.</div>
</div>

<div class="card">
<label>Select Month</label>
<input type="month" id="month">
<div class="tabs">
<button id="tab1" class="active" onclick="changeTab(1)">1 – 15</button>
<button id="tab2" onclick="changeTab(2)">16 – END</button>
</div>
</div>

<div class="card">
<div id="days"></div>
<div class="total" id="total">TOTAL: Rs. 0</div>
</div>

<div class="card">
<button class="clearbtn" onclick="clearMonth()">CLEAR THIS MONTH</button>
<div class="small">Attendance is saved only on this device.</div>
</div>

<script>
const rates={Day:1550,Evening:1650,Night:2250};
const poya2026=[
"2026-01-03","2026-02-01","2026-03-02",
"2026-04-01","2026-05-01","2026-05-30",
"2026-06-29","2026-07-29","2026-08-27",
"2026-09-26","2026-10-25","2026-11-24",
"2026-12-23"
];
let tab=1;
let month=document.getElementById("month");
let cashier=document.getElementById("cashier");
let data=JSON.parse(localStorage.getItem("cashierData")||"{}");
cashier.value=localStorage.getItem("cashierName")||"";
month.value=new Date().toISOString().slice(0,7);

function saveName(){
 let n=cashier.value.trim();
 if(!n)return alert("Enter cashier name");
 localStorage.setItem("cashierName",n);
 render();
}
function key(day){
 return (localStorage.getItem("cashierName")||"")+
 "|"+month.value+"|"+day;
}
function save(){
 localStorage.setItem("cashierData",JSON.stringify(data));
}
function changeTab(n){
 tab=n;
 document.getElementById("tab1").classList.toggle("active",n===1);
 document.getElementById("tab2").classList.toggle("active",n===2);
 render();
}
function toggleShift(day,shift){
 let k=key(day);
 if(!data[k])data[k]=[];
 if(data[k].includes(shift))data[k]=data[k].filter(x=>x!==shift);
 else data[k].push(shift);
 save();render();
}
function isPoya(date){
 return poya2026.includes(date);
}
function render(){
 let box=document.getElementById("days");
 box.innerHTML="";
 if(!month.value)return;
 let [year,mon]=month.value.split("-").map(Number);
 let last=new Date(year,mon,0).getDate();
 let start=tab===1?1:16;
 let end=tab===1?15:last;
 let total=0;
 for(let d=start;d<=end;d++){
  let date=year+"-"+String(mon).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  let shifts=data[key(d)]||[];
  let salary=shifts.reduce((s,x)=>s+rates[x],0);
  total+=salary;
  let poya=isPoya(date);
  let row=document.createElement("div");
  row.className="dateRow";
  let left=poya?
   '<div class="poya"><div class="poyaLetters">P<br>O<br>Y<br>A<br>D<br>A<br>Y</div><div>🌕 POYA DAY</div></div>':
   '<div class="dateName">'+d+' / '+mon+'</div>';
  row.innerHTML=`
   <div class="dateTop">
    ${left}
    <div class="salary">Rs. ${salary.toLocaleString("en-US")}</div>
   </div>
   <div class="shiftButtons">
    <button class="daybtn ${shifts.includes("Day")?"selected":""}" onclick="toggleShift(${d},'Day')">🟢 Day</button>
    <button class="evebtn ${shifts.includes("Evening")?"selected":""}" onclick="toggleShift(${d},'Evening')">🟠 Evening</button>
    <button class="nightbtn ${shifts.includes("Night")?"selected":""}" onclick="toggleShift(${d},'Night')">🌙 Night</button>
   </div>
   <div class="off">${shifts.length?shifts.join(" + "):"OFF"}</div>`;
  box.appendChild(row);
 }
 document.getElementById("total").textContent=
 "TOTAL: Rs. "+total.toLocaleString("en-US");
}
function clearMonth(){
 if(!confirm("Clear this month's attendance?"))return;
 let [y,m]=month.value.split("-");
 Object.keys(data).forEach(k=>{
  if(k.startsWith((localStorage.getItem("cashierName")||"")+"|"+month.value+"|"))
   delete data[k];
 });
 save();render();
}
function clock(){
 let now=new Date();
 document.getElementById("clock").textContent=now.toLocaleTimeString();
 document.getElementById("today").textContent=now.toDateString();
}
month.addEventListener("change",render);
setInterval(clock,1000);clock();render();
</script>
</body>
</html>
